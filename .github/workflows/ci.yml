name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, curl, session, filter
          coverage: none

      - name: Install Development Dependencies
        run: npm ci

      - name: Typecheck and Compile
        run: npm run build

      - name: Run Repository Hygiene Check
        run: npm run check:hygiene

      - name: Install and Run Betterleaks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download --repo betterleaks/betterleaks --pattern "*_linux_x64.tar.gz" --output betterleaks.tar.gz
          tar -xzf betterleaks.tar.gz
          sudo mv betterleaks /usr/local/bin/
          betterleaks git . --gitleaks-ignore-path .betterleaksignore --exit-code 1

      - name: Run Automated Test Suite
        run: npm test


